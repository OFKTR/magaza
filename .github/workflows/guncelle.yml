name: Katalogu guncelle ve yayinla

on:
  schedule:
    - cron: "17 */3 * * *"   # her 3 saatte bir (UTC)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resim donusturucuyu kur
        run: pip install --quiet pillow
      - name: XML'i indir, iyzico linklerini esitle, urunler.json olustur
        env:
          XML_URL: ${{ secrets.XML_URL }}
          XML_URL_2: ${{ secrets.XML_URL_2 }}
          XML_URL_3: ${{ secrets.XML_URL_3 }}
          IYZICO_API_KEY: ${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY: ${{ secrets.IYZICO_SECRET_KEY }}
        run: python guncelle.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Yayin takildiysa bekle
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - name: Yayini yeniden dene
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
