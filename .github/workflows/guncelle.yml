name: Katalogu guncelle ve yayinla

on:
  schedule:
    - cron: "17 */3 * * *"   # her 3 saatte bir (UTC)
  workflow_dispatch:          # Actions sekmesinden elle de çalıştırılabilir
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Onceki yayinin fiyat gecmisini al
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -fsSL "$SITE/fiyat_gecmisi.json" -o onceki_fiyat_gecmisi.json || rm -f onceki_fiyat_gecmisi.json
          curl -fsSL "$SITE/urunler.json" -o onceki_urunler.json || rm -f onceki_urunler.json
      - name: Tek seferlik eski fiyat kaydi
        if: hashFiles('eski_fiyat_kaynagi.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read RUN TARIH < eski_fiyat_kaynagi.txt
          mkdir -p eski
          if gh run download "$RUN" -n github-pages -D eski -R "${{ github.repository }}" && tar -xf eski/artifact.tar -C eski; then
            cp eski/urunler.json eski_urunler.json && echo "$TARIH" > eski_urunler_tarih.txt
          else
            echo "Eski yayin arsivi alinamadi (suresi dolmus olabilir), atlaniyor."
          fi
      - name: Resim donusturucuyu kur
        run: pip install --quiet pillow
      - name: XML'i indir, iyzico linklerini esitle, urunler.json olustur
        env:
          XML_URL: ${{ secrets.XML_URL }}
          XML_URL_2: ${{ secrets.XML_URL_2 }}
          XML_URL_3: ${{ secrets.XML_URL_3 }}
          IYZICO_API_KEY: ${{ secrets.IYZICO_API_KEY }}
          IYZICO_SECRET_KEY: ${{ secrets.IYZICO_SECRET_KEY }}
        run: python guncelle.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Yayin takildiysa bekle
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - name: Yayini yeniden dene
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
